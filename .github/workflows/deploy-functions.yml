
name: Deploy Tictoe Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: tictoe-1st
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true
          service_account: credentials_json:${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project tictoe-1st --debug
